<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain & City - A Pixel Narrative</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
            font-family: 'Courier New', monospace;
            color: #fff;
        }

        #gameCanvas {
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #87CEEB;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 800px;
            justify-content: center;
        }

        button {
            background: #4a4a4a;
            color: #fff;
            border: 2px solid #666;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #5a5a5a;
            border-color: #888;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .narrative-box {
            margin-top: 20px;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border: 2px solid #444;
            border-radius: 4px;
            min-height: 80px;
        }

        .narrative-text {
            line-height: 1.6;
            font-size: 14px;
        }

        h1 {
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 28px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>
    <h1>🏔️ Mountain & City: A Pixel Narrative</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="controls">
        <button id="btnPause">⏸️ Pause</button>
        <button id="btnSpeedUp">⚡ Speed Up Time</button>
        <button id="btnSlowDown">🐌 Slow Down Time</button>
        <button id="btnTogglePollution">🏭 Toggle Pollution</button>
        <button id="btnReset">🔄 Reset Scene</button>
    </div>

    <div class="narrative-box">
        <div class="narrative-text" id="narrativeText">
            Welcome to this pixel world. On the left stands an ancient mountain, peaceful and eternal.
            On the right, a bustling city pulses with life... and consequence.
        </div>
        <div class="stats">
            <div class="stat">
                <span>⏰ Time:</span>
                <span id="timeDisplay">Day 1</span>
            </div>
            <div class="stat">
                <span>💨 Pollution Level:</span>
                <span id="pollutionDisplay">0%</span>
            </div>
            <div class="stat">
                <span>🏔️ Mountain Mood:</span>
                <span id="mountainMoodDisplay">Peaceful</span>
            </div>
        </div>
    </div>

    <script src="pixel-narrative.js"></script>
</body>
</html>
